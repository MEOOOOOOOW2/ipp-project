<!doctype html>
<html><head><meta charset="utf-8"><title>Red-Flag Screener</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px}
button{padding:10px 18px;margin-top:12px}#msg{margin-top:16px}</style></head>
<body>
<h2>Earnings Red-Flag Screener</h2>
<p>Upload a company Excel file (sheets: Info, Income, Balance Sheet, Cash Flow; years across the top). You get the same file back with Summary, Ratios, Scores, Charts and Checks sheets added. Max file size 4 MB.</p>
<input type="file" id="f" accept=".xlsx"><br>
<button id="go">Analyse</button>
<div id="msg"></div>
<script>
document.getElementById("go").onclick = async () => {      // when Analyse is clicked
  const file = document.getElementById("f").files[0];       // the chosen file
  const msg = document.getElementById("msg");               // status area
  if (!file) { msg.textContent = "Choose a file first."; return; }
  msg.textContent = "Analysing...";
  const r = await fetch("/api/analyze", { method: "POST", body: file });   // send the file to Python
  if (!r.ok) { msg.textContent = "Error: " + await r.text(); return; }     // show the error text
  const url = URL.createObjectURL(await r.blob());          // turn the reply into a download link
  const a = Object.assign(document.createElement("a"), { href: url, download: "analysed_" + file.name });
  a.click(); msg.textContent = "Done - your analysed file was downloaded.";
};
</script></body></html>
